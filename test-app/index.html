<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Core Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    .toggle-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #4a90d9;
      color: #fff;
    }
    .toggle-btn:not(.active) {
      background: #2a2a4a;
      color: #888;
    }
    .toggle-btn:hover {
      opacity: 0.9;
    }
    .select-input {
      padding: 8px;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      background: #2a2a4a;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .select-truncate {
      width: 120px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    #scene-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #scene-container.fullscreen {
      padding: 0;
    }
    #scene-wrapper {
      position: relative;
    }
    #scene-container.fullscreen #scene-wrapper {
      width: 100%;
      height: 100%;
    }
    canvas {
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      display: block;
    }
    #scene-container.fullscreen canvas {
      border-radius: 0;
      border: none;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
    }
    #stats {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #fff;
      font-size: 12px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2a2a4a;
      transition: 0.3s;
      border-radius: 24px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #888;
      transition: 0.3s;
      border-radius: 50%;
    }
    .toggle-switch input:checked + .toggle-slider {
      background: #4a90d9;
    }
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
      background: #fff;
    }

    /* Floating Panel Styles */
    .floating-panel {
      position: fixed;
      top: 16px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      width: 300px;
      display: flex;
      flex-direction: column;
    }
    #effects-panel {
      max-height: calc(100vh - 32px);
      overflow: hidden;
    }
    #effects-panel .effects-content {
      overflow-y: auto;
    }
    #entity-panel {
      overflow: hidden;
    }
    #entity-panel .effects-content {
      overflow: hidden;
    }
    #settings-panel .effects-content {
      overflow: hidden;
    }
    .snap-preview {
      position: fixed;
      top: 0;
      width: 4px;
      background: #4a90d9;
      border-radius: 2px;
      pointer-events: none;
      z-index: 1001;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .snap-preview.visible {
      opacity: 1;
    }
    .anchor-indicator {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 2px dashed #4a90d9;
      border-radius: 8px;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
    .anchor-indicator.visible {
      opacity: 0.6;
    }
    .anchor-indicator.active {
      opacity: 1;
      border-style: solid;
      background: rgba(74, 144, 217, 0.2);
      transform: scale(1.1);
    }
    .panel-btn {
      padding: 8px 12px;
      background: #3a4a6a;
      border: 1px solid #4a5a7a;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .panel-btn:hover:not(:disabled) {
      background: #4a5a8a;
    }
    .panel-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .panel-btn-danger {
      background: #4a3a5a;
      border-color: #5a4a6a;
    }
    .panel-btn-danger:hover {
      background: #5a4a6a;
    }
    .effects-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      padding-left: 0;
      cursor: move;
      user-select: none;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .detach-grip {
      width: 12px;
      height: 100%;
      min-height: 20px;
      background: linear-gradient(90deg, #3a3a5a 0%, #3a3a5a 40%, transparent 40%, transparent 60%, #3a3a5a 60%, #3a3a5a 100%);
      background-size: 6px 100%;
      cursor: grab;
      flex-shrink: 0;
      margin-right: 8px;
      border-radius: 4px 0 0 4px;
      opacity: 0.6;
      transition: opacity 0.15s, background-color 0.15s;
    }
    .detach-grip:hover {
      opacity: 1;
      background-color: rgba(74, 144, 217, 0.3);
    }
    .detach-grip:active {
      cursor: grabbing;
    }
    .collapse-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .collapse-btn:hover {
      color: #fff;
    }
    .effects-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }
    .effects-content.collapsed {
      display: none;
    }
    .effect-section {
      background: #1a1a2e;
      border-radius: 6px;
      padding: 12px;
      border: 1px solid #2a2a4a;
    }
    .effect-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .effect-title {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }
    .effect-params {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .param-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .param-row label {
      font-size: 12px;
      color: #888;
      min-width: 120px;
    }
    .param-row input {
      width: 80px;
      padding: 6px 8px;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      background: #2a2a4a;
      color: #fff;
      font-size: 12px;
    }
    .effect-entities {
      border-top: 1px solid #2a2a4a;
      padding-top: 12px;
    }
    .entities-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .entities-header span {
      font-size: 12px;
      color: #888;
    }
    .add-entity-btn {
      padding: 4px 8px;
      background: #3a3a5a;
      border: none;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      font-size: 11px;
    }
    .add-entity-btn:hover {
      background: #4a4a6a;
      color: #fff;
    }
    .entity-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .entity-item {
      background: #2a2a4a;
      padding: 10px;
      border-radius: 4px;
      overflow: hidden;
    }
    .entity-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      min-width: 0;
    }
    .entity-row:last-child {
      margin-bottom: 0;
    }
    .entity-row-header {
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid #3a3a5a;
    }
    .entity-item select,
    .entity-item input {
      padding: 5px 8px;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      background: #1a1a2e;
      color: #fff;
      font-size: 11px;
    }
    .entity-item select {
      flex: 1;
      min-width: 0;
    }
    .entity-item input {
      width: 50px;
      flex-shrink: 0;
    }
    .entity-item label {
      font-size: 11px;
      color: #888;
      min-width: 45px;
    }
    .entity-item .remove-btn {
      padding: 4px 8px;
      background: #3a4a6a;
      border: none;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      font-size: 10px;
    }
    .entity-item .remove-btn:hover {
      background: #4a5a7a;
      color: #fff;
    }
    .empty-message {
      font-size: 11px;
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="scene-container" class="fullscreen">
    <div id="scene-wrapper">
      <div id="info">Move mouse to attract entities | Drag to move</div>
      <div id="stats">Entities: 0 | Obstacles: 0</div>
    </div>
  </div>

  <!-- Floating Settings Panel -->
  <div id="settings-panel" class="floating-panel">
    <div class="effects-header" id="settings-drag-handle">
      <div class="detach-grip" id="settings-detach-grip"></div>
      <span style="flex:1">Overlay Settings</span>
      <button class="collapse-btn" id="settings-collapse">+</button>
    </div>
    <div class="effects-content collapsed" id="settings-content">
      <div class="effect-section">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button id="btn-fullscreen" class="toggle-btn active" style="flex:1">Fullscreen</button>
          <button id="btn-fixed" class="toggle-btn" style="flex:1">Fixed</button>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Width:</label>
            <input type="number" id="input-width" value="800" disabled>
          </div>
          <div class="param-row">
            <label>Height:</label>
            <input type="number" id="input-height" value="600" disabled>
          </div>
        </div>
        <button id="btn-apply" class="panel-btn" disabled style="width:100%;margin-top:8px">Apply Size</button>
      </div>
      <div class="effect-section">
        <div class="effect-header" style="margin-bottom:0">
          <label class="toggle-switch">
            <input type="checkbox" id="checkbox-debug">
            <span class="toggle-slider"></span>
          </label>
          <span class="effect-title">Debug Mode</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Entity Panel -->
  <div id="entity-panel" class="floating-panel">
    <div class="effects-header" id="entity-drag-handle">
      <div class="detach-grip" id="entity-detach-grip"></div>
      <span style="flex:1">Entity Management</span>
      <button class="collapse-btn" id="entity-collapse">+</button>
    </div>
    <div class="effects-content collapsed" id="entity-content">
      <div class="effect-section">
        <div class="effect-params">
          <div class="param-row">
            <label>Image:</label>
            <select id="select-entity-image" class="select-input select-truncate">
              <option value="">None</option>
              <option value="/bf_koban_512.png">bf_koban_512.png</option>
              <option value="/test-bg.png">test-bg.png</option>
            </select>
          </div>
          <div class="param-row">
            <label>Type:</label>
            <select id="select-entity-type" class="select-input select-truncate">
              <option value="GROUNDED_FOLLOW">Follow</option>
              <option value="GROUNDED_STATIC">Static</option>
            </select>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
          <button id="btn-spawn-entity" class="panel-btn">Spawn Entity</button>
          <button id="btn-spawn-obstacle" class="panel-btn">Add Obstacle</button>
          <button id="btn-spawn-falling" class="panel-btn">Add Falling</button>
        </div>
      </div>
      <div class="effect-section">
        <div style="display:flex;flex-direction:column;gap:6px">
          <button id="btn-release-group" class="panel-btn">Release "platforms"</button>
          <button id="btn-release-all" class="panel-btn">Release All</button>
        </div>
      </div>
      <div class="effect-section">
        <div style="display:flex;flex-direction:column;gap:6px">
          <button id="btn-remove-entities" class="panel-btn panel-btn-danger">Remove Entities</button>
          <button id="btn-remove-obstacles" class="panel-btn panel-btn-danger">Remove Obstacles</button>
          <button id="btn-remove-all" class="panel-btn panel-btn-danger">Remove All</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Effects Panel -->
  <div id="effects-panel" class="floating-panel">
    <div class="effects-header" id="effects-drag-handle">
      <div class="detach-grip" id="effects-detach-grip"></div>
      <span style="flex:1">Effects</span>
      <button class="collapse-btn" id="effects-collapse">+</button>
    </div>
    <div class="effects-content collapsed" id="effects-content">
      <!-- Burst Effect -->
      <div class="effect-section">
        <div class="effect-header">
          <label class="toggle-switch">
            <input type="checkbox" id="checkbox-burst">
            <span class="toggle-slider"></span>
          </label>
          <span class="effect-title">Burst Effect</span>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Interval (ms):</label>
            <input type="number" id="burst-interval" value="2000" min="100">
          </div>
          <div class="param-row">
            <label>Count:</label>
            <input type="number" id="burst-count" value="8" min="1">
          </div>
          <div class="param-row">
            <label>Force:</label>
            <input type="number" id="burst-force" value="15" min="1">
          </div>
        </div>
        <div class="effect-entities">
          <div class="entities-header">
            <span>Entity Types</span>
            <button class="add-entity-btn" id="burst-add-entity">+ Add</button>
          </div>
          <div class="entity-list" id="burst-entity-list"></div>
        </div>
      </div>

      <!-- Rain Effect -->
      <div class="effect-section">
        <div class="effect-header">
          <label class="toggle-switch">
            <input type="checkbox" id="checkbox-rain">
            <span class="toggle-slider"></span>
          </label>
          <span class="effect-title">Rain Effect</span>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Spawn Rate (per sec):</label>
            <input type="number" id="rain-spawn-rate" value="5" min="0.1" step="0.5">
          </div>
          <div class="param-row">
            <label>Spawn Width (0-1):</label>
            <input type="number" id="rain-spawn-width" value="1" min="0.1" max="1" step="0.1">
          </div>
        </div>
        <div class="effect-entities">
          <div class="entities-header">
            <span>Entity Types</span>
            <button class="add-entity-btn" id="rain-add-entity">+ Add</button>
          </div>
          <div class="entity-list" id="rain-entity-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
