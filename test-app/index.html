<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Core Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    .toggle-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #4a90d9;
      color: #fff;
    }
    .toggle-btn:not(.active) {
      background: #2a2a4a;
      color: #888;
    }
    .toggle-btn:hover {
      opacity: 0.9;
    }
    .select-input {
      padding: 8px;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      background: #2a2a4a;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .select-truncate {
      width: 120px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    #scene-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #scene-container.fullscreen {
      padding: 0;
    }
    #scene-wrapper {
      position: relative;
    }
    #scene-container.fullscreen #scene-wrapper {
      width: 100%;
      height: 100%;
    }
    canvas {
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      display: block;
    }
    #scene-container.fullscreen canvas {
      border-radius: 0;
      border: none;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
    }
    #stats {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #fff;
      font-size: 12px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2a2a4a;
      transition: 0.3s;
      border-radius: 24px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #888;
      transition: 0.3s;
      border-radius: 50%;
    }
    .toggle-switch input:checked + .toggle-slider {
      background: #4a90d9;
    }
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
      background: #fff;
    }

    /* Extend blork-tabs content with flex layout */
    .blork-tabs-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Panel button styles (app-specific content) */
    .panel-btn {
      padding: 8px 12px;
      background: #3a4a6a;
      border: 1px solid #4a5a7a;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .panel-btn:hover:not(:disabled) {
      background: #4a5a8a;
    }
    .panel-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .panel-btn-danger {
      background: #4a3a5a;
      border-color: #5a4a6a;
    }
    .panel-btn-danger:hover {
      background: #5a4a6a;
    }
    .effect-section {
      background: #1a1a2e;
      border-radius: 6px;
      padding: 12px;
      border: 1px solid #2a2a4a;
    }
    .effect-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .effect-title {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }
    .effect-params {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .param-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .param-row label {
      font-size: 12px;
      color: #888;
      min-width: 120px;
    }
    .param-row input {
      width: 80px;
      padding: 6px 8px;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      background: #2a2a4a;
      color: #fff;
      font-size: 12px;
    }
    .effect-entities {
      border-top: 1px solid #2a2a4a;
      padding-top: 12px;
    }
    .entities-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .entities-header span {
      font-size: 12px;
      color: #888;
    }
    .add-entity-btn {
      padding: 4px 8px;
      background: #3a3a5a;
      border: none;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      font-size: 11px;
    }
    .add-entity-btn:hover {
      background: #4a4a6a;
      color: #fff;
    }
    .entity-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .entity-item {
      background: #2a2a4a;
      padding: 10px;
      border-radius: 4px;
      overflow: hidden;
    }
    .entity-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      min-width: 0;
    }
    .entity-row:last-child {
      margin-bottom: 0;
    }
    .entity-row-header {
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid #3a3a5a;
    }
    .entity-item select,
    .entity-item input {
      padding: 5px 8px;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      background: #1a1a2e;
      color: #fff;
      font-size: 11px;
    }
    .entity-item select {
      flex: 1;
      min-width: 0;
    }
    .entity-item input {
      width: 50px;
      flex-shrink: 0;
    }
    .entity-item label {
      font-size: 11px;
      color: #888;
      min-width: 45px;
    }
    .entity-item .remove-btn {
      padding: 4px 8px;
      background: #3a4a6a;
      border: none;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      font-size: 10px;
    }
    .entity-item .remove-btn:hover {
      background: #4a5a7a;
      color: #fff;
    }
    .empty-message {
      font-size: 11px;
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="scene-container" class="fullscreen">
    <div id="scene-wrapper">
      <div id="info">Move mouse to attract entities | Drag to move</div>
      <div id="stats">Entities: 0 | Obstacles: 0</div>
    </div>
  </div>

  <!-- Floating Settings Panel -->
  <div id="settings-panel" class="blork-tabs-panel">
    <div class="blork-tabs-header" id="settings-drag-handle">
      <div class="blork-tabs-detach-grip" id="settings-detach-grip"></div>
      <span class="blork-tabs-title">Overlay Settings</span>
      <button class="blork-tabs-collapse-btn" id="settings-collapse">+</button>
    </div>
    <div class="blork-tabs-content blork-tabs-content-collapsed" id="settings-content">
      <div class="effect-section">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button id="btn-fullscreen" class="toggle-btn active" style="flex:1">Fullscreen</button>
          <button id="btn-fixed" class="toggle-btn" style="flex:1">Fixed</button>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Width:</label>
            <input type="number" id="input-width" value="800" disabled>
          </div>
          <div class="param-row">
            <label>Height:</label>
            <input type="number" id="input-height" value="600" disabled>
          </div>
        </div>
        <button id="btn-apply" class="panel-btn" disabled style="width:100%;margin-top:8px">Apply Size</button>
      </div>
      <div class="effect-section">
        <div class="effect-header" style="margin-bottom:0">
          <label class="toggle-switch">
            <input type="checkbox" id="checkbox-debug">
            <span class="toggle-slider"></span>
          </label>
          <span class="effect-title">Debug Mode</span>
        </div>
      </div>
      <div class="effect-section">
        <div class="effect-params">
          <div class="param-row">
            <label>Log Level:</label>
            <select id="select-log-level" class="select-input">
              <option value="warn">Warn (quiet)</option>
              <option value="info">Info</option>
              <option value="debug">Debug (verbose)</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Entity Panel -->
  <div id="entity-panel" class="blork-tabs-panel">
    <div class="blork-tabs-header" id="entity-drag-handle">
      <div class="blork-tabs-detach-grip" id="entity-detach-grip"></div>
      <span class="blork-tabs-title">Entity Management</span>
      <button class="blork-tabs-collapse-btn" id="entity-collapse">+</button>
    </div>
    <div class="blork-tabs-content blork-tabs-content-collapsed" id="entity-content">
      <div class="effect-section">
        <div class="effect-params">
          <div class="param-row">
            <label>Image:</label>
            <select id="select-entity-image" class="select-input select-truncate">
              <option value="">None</option>
              <option value="/bf_koban_512.png">bf_koban_512.png</option>
            </select>
          </div>
          <div class="param-row">
            <label>TTL (ms):</label>
            <input type="number" id="input-entity-ttl" placeholder="∞" min="0" step="100">
          </div>
          <div class="param-row">
            <label>X:</label>
            <input type="number" id="input-spawn-x" value="50" step="1" style="width:50px">
            <select id="select-x-unit" class="select-input" style="width:45px;padding:6px 4px">
              <option value="percent">%</option>
              <option value="pixel">px</option>
            </select>
          </div>
          <div class="param-row">
            <label>Y:</label>
            <input type="number" id="input-spawn-y" value="50" step="1" style="width:50px">
            <select id="select-y-unit" class="select-input" style="width:45px;padding:6px 4px">
              <option value="percent">%</option>
              <option value="pixel">px</option>
            </select>
          </div>
        </div>
        <div class="tag-picker" style="margin-top:12px">
          <div style="font-size:12px;color:#888;margin-bottom:8px">Tags</div>
          <div style="display:flex;gap:8px;align-items:stretch">
            <div style="flex:1;display:flex;flex-direction:column">
              <div style="font-size:10px;color:#666;margin-bottom:4px">Available</div>
              <select id="tags-available" multiple style="flex:1;min-height:80px;background:#1a1a2e;border:1px solid #3a3a5a;border-radius:4px;color:#fff;font-size:11px;padding:4px">
              </select>
            </div>
            <div style="display:flex;flex-direction:column;justify-content:center;gap:4px">
              <button id="btn-tag-add" class="panel-btn" style="padding:4px 8px;font-size:14px">&gt;&gt;</button>
              <button id="btn-tag-remove" class="panel-btn" style="padding:4px 8px;font-size:14px">&lt;&lt;</button>
            </div>
            <div style="flex:1;display:flex;flex-direction:column">
              <div style="font-size:10px;color:#666;margin-bottom:4px">Selected</div>
              <select id="tags-selected" multiple style="flex:1;min-height:80px;background:#1a1a2e;border:1px solid #3a3a5a;border-radius:4px;color:#fff;font-size:11px;padding:4px">
              </select>
            </div>
          </div>
        </div>
        <div style="margin-top:12px">
          <button id="btn-spawn-entity" class="panel-btn" style="width:100%">Spawn Entity</button>
        </div>
      </div>
      <div class="effect-section">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;gap:6px;align-items:center">
            <select id="select-release-tag" class="select-input" style="flex:1">
              <option value="">-- Select Tag --</option>
            </select>
            <button id="btn-release-tag" class="panel-btn">Release</button>
          </div>
          <button id="btn-release-all" class="panel-btn">Release All</button>
        </div>
      </div>
      <div class="effect-section">
        <div class="effect-header" style="margin-bottom:8px">
          <span class="effect-title">Text Obstacles</span>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Text:</label>
            <input type="text" id="input-text-obstacle" value="ABCDEFGHIJKLMNOPQRSTUVWXYZ" style="width:120px" placeholder="A-Z, 0-9">
          </div>
          <div class="param-row">
            <label>Font:</label>
            <select id="select-font" class="select-input">
              <!-- Populated dynamically from API -->
            </select>
          </div>
          <div class="param-row">
            <label>Letter Size:</label>
            <input type="number" id="input-letter-size" value="60" min="20" max="200">
          </div>
          <div class="param-row">
            <label>Letter Spacing:</label>
            <input type="number" id="input-letter-spacing" value="0" min="0" max="200">
          </div>
          <div class="param-row">
            <label>Color:</label>
            <input type="text" id="input-letter-color" placeholder="#ff0000" style="width:80px">
          </div>
          <div class="param-row">
            <label>Line Spacing:</label>
            <input type="number" id="input-line-spacing" placeholder="30">
          </div>
          <div class="param-row">
            <label>X:</label>
            <input type="number" id="input-text-origin-x" value="50" step="1" style="width:50px">
            <select id="select-text-x-unit" class="select-input" style="width:45px;padding:6px 4px">
              <option value="percent">%</option>
              <option value="pixel">px</option>
            </select>
          </div>
          <div class="param-row">
            <label>Y:</label>
            <input type="number" id="input-text-origin-y" value="50" step="1" style="width:50px">
            <select id="select-text-y-unit" class="select-input" style="width:45px;padding:6px 4px">
              <option value="percent">%</option>
              <option value="pixel">px</option>
            </select>
          </div>
        </div>
        <div class="tag-picker" style="margin-top:12px">
          <div style="font-size:12px;color:#888;margin-bottom:8px">Tags</div>
          <div style="display:flex;gap:8px;align-items:stretch">
            <div style="flex:1;display:flex;flex-direction:column">
              <div style="font-size:10px;color:#666;margin-bottom:4px">Available</div>
              <select id="text-tags-available" multiple style="flex:1;min-height:80px;background:#1a1a2e;border:1px solid #3a3a5a;border-radius:4px;color:#fff;font-size:11px;padding:4px">
              </select>
            </div>
            <div style="display:flex;flex-direction:column;justify-content:center;gap:4px">
              <button id="btn-text-tag-add" class="panel-btn" style="padding:4px 8px;font-size:14px">&gt;&gt;</button>
              <button id="btn-text-tag-remove" class="panel-btn" style="padding:4px 8px;font-size:14px">&lt;&lt;</button>
            </div>
            <div style="flex:1;display:flex;flex-direction:column">
              <div style="font-size:10px;color:#666;margin-bottom:4px">Selected</div>
              <select id="text-tags-selected" multiple style="flex:1;min-height:80px;background:#1a1a2e;border:1px solid #3a3a5a;border-radius:4px;color:#fff;font-size:11px;padding:4px">
              </select>
            </div>
          </div>
        </div>
        <div style="margin-top:12px">
          <button id="btn-spawn-text" class="panel-btn" style="width:100%">Spawn Text</button>
        </div>
      </div>
      <div class="effect-section">
        <div style="display:flex;flex-direction:column;gap:6px">
          <button id="btn-remove-entities" class="panel-btn panel-btn-danger">Remove Entities</button>
          <button id="btn-remove-obstacles" class="panel-btn panel-btn-danger">Remove Obstacles</button>
          <button id="btn-remove-all" class="panel-btn panel-btn-danger">Remove All</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Effects Panel -->
  <div id="effects-panel" class="blork-tabs-panel">
    <div class="blork-tabs-header" id="effects-drag-handle">
      <div class="blork-tabs-detach-grip" id="effects-detach-grip"></div>
      <span class="blork-tabs-title">Effects</span>
      <button class="blork-tabs-collapse-btn" id="effects-collapse">+</button>
    </div>
    <div class="blork-tabs-content blork-tabs-content-collapsed" id="effects-content">
      <!-- Burst Effect -->
      <div class="effect-section">
        <div class="effect-header">
          <label class="toggle-switch">
            <input type="checkbox" id="checkbox-burst">
            <span class="toggle-slider"></span>
          </label>
          <span class="effect-title">Burst Effect</span>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Interval (ms):</label>
            <input type="number" id="burst-interval" value="2000" min="100">
          </div>
          <div class="param-row">
            <label>Count:</label>
            <input type="number" id="burst-count" value="8" min="1">
          </div>
          <div class="param-row">
            <label>Force:</label>
            <input type="number" id="burst-force" value="15" min="1">
          </div>
        </div>
        <div class="effect-entities">
          <div class="entities-header">
            <span>Entity Types</span>
            <button class="add-entity-btn" id="burst-add-entity">+ Add</button>
          </div>
          <div class="entity-list" id="burst-entity-list"></div>
        </div>
      </div>

      <!-- Rain Effect -->
      <div class="effect-section">
        <div class="effect-header">
          <label class="toggle-switch">
            <input type="checkbox" id="checkbox-rain">
            <span class="toggle-slider"></span>
          </label>
          <span class="effect-title">Rain Effect</span>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Spawn Rate (per sec):</label>
            <input type="number" id="rain-spawn-rate" value="5" min="0.1" step="0.5">
          </div>
          <div class="param-row">
            <label>Spawn Width (0-1):</label>
            <input type="number" id="rain-spawn-width" value="1" min="0.1" max="1" step="0.1">
          </div>
        </div>
        <div class="effect-entities">
          <div class="entities-header">
            <span>Entity Types</span>
            <button class="add-entity-btn" id="rain-add-entity">+ Add</button>
          </div>
          <div class="entity-list" id="rain-entity-list"></div>
        </div>
      </div>

      <!-- Stream Effect -->
      <div class="effect-section">
        <div class="effect-header">
          <label class="toggle-switch">
            <input type="checkbox" id="checkbox-stream">
            <span class="toggle-slider"></span>
          </label>
          <span class="effect-title">Stream Effect</span>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Origin X (%):</label>
            <input type="number" id="stream-origin-x" value="50" min="-50" max="150" step="5">
          </div>
          <div class="param-row">
            <label>Origin Y (%):</label>
            <input type="number" id="stream-origin-y" value="0" min="-50" max="150" step="5">
          </div>
          <div class="param-row">
            <label>Direction (deg):</label>
            <input type="number" id="stream-direction" value="90" min="0" max="360" step="5">
          </div>
          <div class="param-row">
            <label>Spawn Rate (/sec):</label>
            <input type="number" id="stream-spawn-rate" value="10" min="0.1" step="0.5">
          </div>
          <div class="param-row">
            <label>Force:</label>
            <input type="number" id="stream-force" value="15" min="1">
          </div>
          <div class="param-row">
            <label>Cone Angle (deg):</label>
            <input type="number" id="stream-cone-angle" value="15" min="0" max="180" step="5">
          </div>
        </div>
        <div class="effect-entities">
          <div class="entities-header">
            <span>Entity Types</span>
            <button class="add-entity-btn" id="stream-add-entity">+ Add</button>
          </div>
          <div class="entity-list" id="stream-entity-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
