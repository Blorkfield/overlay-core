<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Core Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    #controls {
      display: flex;
      gap: 16px;
      padding: 16px;
      background: #0f0f1a;
      align-items: center;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-group label {
      font-size: 14px;
      color: #aaa;
    }
    .toggle-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #4a90d9;
      color: #fff;
    }
    .toggle-btn:not(.active) {
      background: #2a2a4a;
      color: #888;
    }
    .toggle-btn:hover {
      opacity: 0.9;
    }
    .size-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .size-inputs input {
      width: 80px;
      padding: 8px;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      background: #2a2a4a;
      color: #fff;
      font-size: 14px;
    }
    .size-inputs input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .apply-btn {
      padding: 8px 16px;
      background: #4a90d9;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .apply-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .apply-btn:hover:not(:disabled) {
      background: #5aa0e9;
    }
    .action-btn {
      padding: 8px 16px;
      background: #6a4a9a;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .action-btn:hover {
      background: #7a5aaa;
    }
    .select-input {
      padding: 8px;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      background: #2a2a4a;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #scene-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #scene-container.fullscreen {
      padding: 0;
    }
    #scene-wrapper {
      position: relative;
    }
    #scene-container.fullscreen #scene-wrapper {
      width: 100%;
      height: 100%;
    }
    canvas {
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      display: block;
    }
    #scene-container.fullscreen canvas {
      border-radius: 0;
      border: none;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
    }
    #stats {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #fff;
      font-size: 12px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2a2a4a;
      transition: 0.3s;
      border-radius: 24px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #888;
      transition: 0.3s;
      border-radius: 50%;
    }
    .toggle-switch input:checked + .toggle-slider {
      background: #4a90d9;
    }
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
      background: #fff;
    }

    /* Floating Effects Panel Styles */
    #effects-panel {
      position: fixed;
      top: 80px;
      right: 16px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      max-width: 320px;
      max-height: calc(100vh - 100px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #effects-panel.collapsed {
      max-height: none;
    }
    .effects-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      cursor: move;
      user-select: none;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .collapse-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .collapse-btn:hover {
      color: #fff;
    }
    .effects-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }
    .effects-content.collapsed {
      display: none;
    }
    .effect-section {
      background: #1a1a2e;
      border-radius: 6px;
      padding: 12px;
      border: 1px solid #2a2a4a;
    }
    .effect-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .effect-title {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }
    .effect-params {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .param-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .param-row label {
      font-size: 12px;
      color: #888;
      min-width: 120px;
    }
    .param-row input {
      width: 80px;
      padding: 6px 8px;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      background: #2a2a4a;
      color: #fff;
      font-size: 12px;
    }
    .effect-entities {
      border-top: 1px solid #2a2a4a;
      padding-top: 12px;
    }
    .entities-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .entities-header span {
      font-size: 12px;
      color: #888;
    }
    .add-entity-btn {
      padding: 4px 8px;
      background: #3a3a5a;
      border: none;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      font-size: 11px;
    }
    .add-entity-btn:hover {
      background: #4a4a6a;
      color: #fff;
    }
    .entity-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .entity-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2a2a4a;
      padding: 8px;
      border-radius: 4px;
      flex-wrap: wrap;
    }
    .entity-item select,
    .entity-item input {
      padding: 4px 6px;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      background: #1a1a2e;
      color: #fff;
      font-size: 11px;
    }
    .entity-item select {
      width: 100px;
    }
    .entity-item input {
      width: 50px;
    }
    .entity-item label {
      font-size: 10px;
      color: #666;
    }
    .entity-item .remove-btn {
      padding: 2px 6px;
      background: #5a3a3a;
      border: none;
      border-radius: 4px;
      color: #ccc;
      cursor: pointer;
      font-size: 10px;
      margin-left: auto;
    }
    .entity-item .remove-btn:hover {
      background: #7a4a4a;
    }
    .empty-message {
      font-size: 11px;
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div class="control-group">
      <label>Mode:</label>
      <button id="btn-fullscreen" class="toggle-btn active">Fullscreen</button>
      <button id="btn-fixed" class="toggle-btn">Fixed</button>
    </div>
    <div class="control-group size-inputs">
      <label>Width:</label>
      <input type="number" id="input-width" value="800" disabled>
      <label>Height:</label>
      <input type="number" id="input-height" value="600" disabled>
      <button id="btn-apply" class="apply-btn" disabled>Apply</button>
    </div>
    <div class="control-group">
      <label>Image:</label>
      <select id="select-entity-image" class="select-input">
        <option value="">None</option>
        <option value="/bf_koban_512.png">bf_koban_512.png</option>
        <option value="/test-bg.png">test-bg.png</option>
      </select>
      <label>Type:</label>
      <select id="select-entity-type" class="select-input">
        <option value="GROUNDED_FOLLOW">Follow</option>
        <option value="GROUNDED_STATIC">Static</option>
      </select>
      <button id="btn-spawn-entity" class="action-btn">Spawn Entity</button>
      <button id="btn-spawn-obstacle" class="action-btn">Add Obstacle</button>
      <button id="btn-spawn-falling" class="action-btn">Add Falling</button>
    </div>
    <div class="control-group">
      <button id="btn-release-group" class="action-btn">Release "platforms"</button>
      <button id="btn-release-all" class="action-btn">Release All</button>
    </div>
    <div class="control-group">
      <button id="btn-remove-entities" class="action-btn">Remove Entities</button>
      <button id="btn-remove-obstacles" class="action-btn">Remove Obstacles</button>
      <button id="btn-remove-all" class="action-btn">Remove All</button>
    </div>
    <div class="control-group" style="margin-left: auto;">
      <label>Debug:</label>
      <label class="toggle-switch">
        <input type="checkbox" id="checkbox-debug">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div id="scene-container" class="fullscreen">
    <div id="scene-wrapper">
      <div id="info">Move mouse to attract entities | Drag to move</div>
      <div id="stats">Entities: 0 | Obstacles: 0</div>
    </div>
  </div>
  <!-- Floating Effects Panel -->
  <div id="effects-panel">
    <div class="effects-header" id="effects-drag-handle">
      <span>Effects</span>
      <button class="collapse-btn" id="effects-collapse">−</button>
    </div>
    <div class="effects-content" id="effects-content">
      <!-- Burst Effect -->
      <div class="effect-section">
        <div class="effect-header">
          <label class="toggle-switch">
            <input type="checkbox" id="checkbox-burst">
            <span class="toggle-slider"></span>
          </label>
          <span class="effect-title">Burst Effect</span>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Interval (ms):</label>
            <input type="number" id="burst-interval" value="2000" min="100">
          </div>
          <div class="param-row">
            <label>Count:</label>
            <input type="number" id="burst-count" value="8" min="1">
          </div>
          <div class="param-row">
            <label>Force:</label>
            <input type="number" id="burst-force" value="15" min="1">
          </div>
        </div>
        <div class="effect-entities">
          <div class="entities-header">
            <span>Entity Types</span>
            <button class="add-entity-btn" id="burst-add-entity">+ Add</button>
          </div>
          <div class="entity-list" id="burst-entity-list"></div>
        </div>
      </div>

      <!-- Rain Effect -->
      <div class="effect-section">
        <div class="effect-header">
          <label class="toggle-switch">
            <input type="checkbox" id="checkbox-rain">
            <span class="toggle-slider"></span>
          </label>
          <span class="effect-title">Rain Effect</span>
        </div>
        <div class="effect-params">
          <div class="param-row">
            <label>Spawn Rate (per sec):</label>
            <input type="number" id="rain-spawn-rate" value="5" min="0.1" step="0.5">
          </div>
          <div class="param-row">
            <label>Spawn Width (0-1):</label>
            <input type="number" id="rain-spawn-width" value="1" min="0.1" max="1" step="0.1">
          </div>
        </div>
        <div class="effect-entities">
          <div class="entities-header">
            <span>Entity Types</span>
            <button class="add-entity-btn" id="rain-add-entity">+ Add</button>
          </div>
          <div class="entity-list" id="rain-entity-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
