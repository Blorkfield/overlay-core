<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Core Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    #controls {
      display: flex;
      gap: 16px;
      padding: 16px;
      background: #0f0f1a;
      align-items: center;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-group label {
      font-size: 14px;
      color: #aaa;
    }
    .toggle-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #4a90d9;
      color: #fff;
    }
    .toggle-btn:not(.active) {
      background: #2a2a4a;
      color: #888;
    }
    .toggle-btn:hover {
      opacity: 0.9;
    }
    .size-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .size-inputs input {
      width: 80px;
      padding: 8px;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      background: #2a2a4a;
      color: #fff;
      font-size: 14px;
    }
    .size-inputs input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .apply-btn {
      padding: 8px 16px;
      background: #4a90d9;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .apply-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .apply-btn:hover:not(:disabled) {
      background: #5aa0e9;
    }
    .action-btn {
      padding: 8px 16px;
      background: #6a4a9a;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .action-btn:hover {
      background: #7a5aaa;
    }
    #scene-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #scene-container.fullscreen {
      padding: 0;
    }
    #scene-wrapper {
      position: relative;
    }
    #scene-container.fullscreen #scene-wrapper {
      width: 100%;
      height: 100%;
    }
    canvas {
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      display: block;
    }
    #scene-container.fullscreen canvas {
      border-radius: 0;
      border: none;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
    }
    #stats {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #fff;
      font-size: 12px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div class="control-group">
      <label>Mode:</label>
      <button id="btn-fullscreen" class="toggle-btn active">Fullscreen</button>
      <button id="btn-fixed" class="toggle-btn">Fixed</button>
    </div>
    <div class="control-group size-inputs">
      <label>Width:</label>
      <input type="number" id="input-width" value="800" disabled>
      <label>Height:</label>
      <input type="number" id="input-height" value="600" disabled>
      <button id="btn-apply" class="apply-btn" disabled>Apply</button>
    </div>
    <div class="control-group">
      <button id="btn-spawn-entity" class="action-btn">Spawn Entity</button>
      <button id="btn-spawn-obstacle" class="action-btn">Add Obstacle</button>
      <button id="btn-spawn-falling" class="action-btn">Add Falling</button>
    </div>
    <div class="control-group">
      <button id="btn-release-group" class="action-btn">Release "platforms"</button>
      <button id="btn-release-all" class="action-btn">Release All</button>
    </div>
    <div class="control-group">
      <button id="btn-remove-entities" class="action-btn">Remove Entities</button>
      <button id="btn-remove-obstacles" class="action-btn">Remove Obstacles</button>
      <button id="btn-remove-all" class="action-btn">Remove All</button>
    </div>
  </div>
  <div id="scene-container" class="fullscreen">
    <div id="scene-wrapper">
      <div id="info">Move mouse to attract entities | Drag to move</div>
      <div id="stats">Entities: 0 | Obstacles: 0</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
